# Naukri Auto-Apply Configuration
# Copy this file to config.yaml and fill in your details.

# Your profile information used to fill application forms
user_profile:
  # Full name as it should appear on applications
  name: "Your Full Name"
  # Email address for applications
  email: "your_email@example.com"
  # Phone number with country code
  phone: "+91-9999999999"
  # Path to your resume PDF (absolute or relative to working directory)
  resume_path: "./resume.pdf"
  # LinkedIn profile URL (optional, used for external forms)
  linkedin_url: "https://linkedin.com/in/yourprofile"
  # Total years of professional experience (optional)
  experience_years: 5
  # Current employer name (optional)
  current_company: "Current Company Name"
  # Current job title (optional)
  current_designation: "Software Engineer"
  # Notice period at current job (optional)
  notice_period: "30 days"

# Naukri.com credentials
# These can also be set via NAUKRI_EMAIL and NAUKRI_PASSWORD environment
# variables in a .env file. Environment variables take priority.
naukri_email: ""
naukri_password: ""

# Password used when filling signup forms on external ATS sites (optional).
# If not set, password fields on external signup forms will be skipped.
signup_password: ""

# Path to the CSV file where application results are logged
output_csv: "applications.csv"

# Delay in seconds between processing each job URL.
# Helps avoid rate-limiting or account flags from rapid requests.
delay_between_applications: 5.0

# Browser settings
# Set to true to run without a visible browser window
headless: false
# Delay in milliseconds between browser actions (increase if pages load slowly)
slow_mo: 100
# Directory to store browser session data (login persists between runs)
user_data_dir: ".browser_data"

# LLM settings (powered by Groq API)
# Set GROQ_API_KEY in your .env file to enable LLM features.
#
# PRIVACY NOTE: When LLM features are enabled, user profile data (name, email,
# phone, LinkedIn URL, experience, company, designation, notice period) is sent
# to the Groq API as part of prompts for form filling and screening questions.
# Ensure you are comfortable with this data being processed by a third-party API.
llm:
  # Enable or disable LLM-powered form filling and screening question answering
  enabled: true
  # Model to use for LLM completions
  model: "meta-llama/llama-4-maverick-17b-128e-instruct"
  # Maximum tokens for LLM responses
  max_tokens: 4096
  # Temperature for LLM responses (lower = more deterministic)
  temperature: 0.2

# Quota and direct-apply settings
quota:
  # Maximum number of Naukri applications before switching to direct apply
  max_naukri_applications: 50
  # When true, after reaching the quota the bot applies directly on company sites
  enable_direct_apply: true
